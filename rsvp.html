<body>
  <main id="main">

    <section id="rsvp" class="rsvp">
      <div class="rsvp-inner wrap">
        <div class="rsvp-intro">
          <h2 class="rsvp-title h2">RSVP</h2>
          <p class="rsvp-lede paragraph-xl">Please kindly respond before October 14, 2026</p>

          <p class="rsvp-contact paragraph-xl">
            Contact either:<br>
            Jyselle: <a href="tel:+18056161555">(805) 616-1555</a><br>
            Kyle: <a href="tel:+16619648819">(661) 964-8819</a><br>
            <br>
            More details to come!
          </p>
        </div>

        <div class="rsvp-form-col">
          <div class="rsvp-stamp">
            <form id="rsvp-form" class="rsvp-form" novalidate>

              <div class="rsvp-form-fields">
                <p class="rsvp-note paragraph-sm">To keep our day intimate, we welcome only the guests named on your invitation.</p>

                <div class="rsvp-field rsvp-field-inline">
                  <label for="rsvp-names">Name(s):</label>
                  <input type="text" id="rsvp-names" name="Name(s)" required>
                </div>

                <div class="rsvp-field">
                  <label class="rsvp-choice">
                    <input type="checkbox" id="rsvp-accepts" name="Accepts with delight" value="Yes">
                    <span>Accepts with delight</span>
                  </label>

                  <div class="rsvp-field-inline rsvp-guest-line">
                    <label for="rsvp-guest-count">Number of guests<br class="rsvp-guest-break">attending:</label>
                    <input type="number" id="rsvp-guest-count" name="Number of guests attending" min="1" max="10" step="1">
                  </div>

                  <label class="rsvp-choice">
                    <input type="checkbox" id="rsvp-declines" name="Declines with regret" value="Yes">
                    <span>Declines with regret</span>
                  </label>
                </div>

                <button type="submit" class="rsvp-submit paragraph-main">SEND RSVP</button>
              </div>

              <p class="rsvp-status paragraph-main" role="status" aria-live="polite" hidden></p>
            </form>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="main.js"></script>
  <script src="rsvp.js"></script>
</body>
</html>
